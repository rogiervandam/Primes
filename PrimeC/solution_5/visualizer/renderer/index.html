<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>Sieve Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header bar -->
        <div id="header">
            <span id="title">Sieve Visualizer</span>
            <span id="file-info"></span>
            <span id="sieve-info"></span>
        </div>

        <!-- Main content area -->
        <div id="main">
            <!-- Left panel: step list -->
            <div id="step-panel">
                <div id="step-panel-header">Steps</div>
                <div id="step-list"></div>
            </div>

            <!-- Center: canvas -->
            <div id="canvas-container">
                <canvas id="sieve-canvas"></canvas>
                <div id="hover-info"></div>
            </div>

            <!-- Right panel: step detail -->
            <div id="detail-panel">
                <div id="detail-header">Step Details</div>
                <div id="detail-content">
                    <div id="detail-step-id"></div>
                    <div id="detail-annotation"></div>
                    <div id="detail-changes"></div>
                </div>
            </div>
        </div>

        <!-- Bottom controls -->
        <div id="controls">
            <button id="btn-first" title="First step (Home)">⏮</button>
            <button id="btn-prev" title="Previous step (←)">⏪</button>
            <button id="btn-play" title="Play/Pause (Space)">▶</button>
            <button id="btn-next" title="Next step (→)">⏩</button>
            <button id="btn-last" title="Last step (End)">⏭</button>
            <input type="range" id="step-slider" min="0" max="0" value="0">
            <span id="step-counter">0 / 0</span>
            <div id="zoom-controls">
                <button id="btn-zoom-out" title="Zoom out (-)">−</button>
                <span id="zoom-level">1x</span>
                <button id="btn-zoom-in" title="Zoom in (+)">+</button>
                <button id="btn-zoom-reset" title="Reset zoom (0)">⊙</button>
            </div>
            <div id="legend">
                <span class="legend-item"><span class="legend-color" style="background:#e8e8e8"></span>0 (prime)</span>
                <span class="legend-item"><span class="legend-color" style="background:#555"></span>1 (composite)</span>
                <span class="legend-item"><span class="legend-color" style="background:#ff4444"></span>changed</span>
            </div>
        </div>

        <!-- Welcome overlay -->
        <div id="welcome-overlay">
            <div id="welcome-content">
                <h2>Sieve Visualizer</h2>
                <p>Open a <code>.sievetrace</code> file to visualize the bit storage changes.</p>
                <p>Use <strong>File → Open Trace</strong> or press <strong>Ctrl+O</strong></p>
                <p class="hint">Generate a trace with: <code>./sieve_extend --trace output.sievetrace</code></p>
            </div>
        </div>
    </div>

    <script src="trace-parser.js"></script>
    <script src="canvas-renderer.js"></script>
    <script src="app.js"></script>
</body>
</html>
